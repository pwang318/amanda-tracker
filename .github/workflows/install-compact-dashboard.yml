name: Clean RM homepage assets
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/install-compact-dashboard.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Remove legacy duplicate script and style references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path=Path('index.html')
          page=path.read_text(encoding='utf-8')
          # Obsolete checklist is superseded by the authoritative daily worklists.
          page=re.sub(r'<script[^>]*outstanding-daily-checklist[.]js[^>]*></script>','',page)
          # Preserve one copy of each in-use external asset and apply current revision.
          assets={
            'compact-workspace.js':'20261110-clean15',
            'daily-execution-coaching.js':'20261110-coaching19',
            'fast-activity-workflow.js':'20261110-fast5',
            'relationship-funnel.js':'20261110-funnel5',
            'scorecard-source-summary.js':'20261110-source4',
          }
          for filename,revision in assets.items():
              page=re.sub(r'<script[^>]*'+re.escape(filename)+r'[^>]*></script>','',page)
              asset='<script defer src="./ui/'+filename+'?v='+revision+'"></script>'
              if '</body>' not in page:
                  raise SystemExit('Missing body close; not modifying homepage')
              page=page.replace('</body>',asset+'</body>',1)
          # Original installer added this identical rule repeatedly outside the body.
          style_re=r'<style[^>]*id="rm-uniform-prospecting-row"[^>]*>.*?</style>'
          blocks=re.findall(style_re,page,flags=re.S)
          page=re.sub(style_re,'',page,flags=re.S)
          if blocks:
              page=page.replace('</head>',blocks[-1]+'</head>',1)
          path.write_text(page,encoding='utf-8')
          print('Removed obsolete checklist and',max(0,len(blocks)-1),'duplicate style blocks')
          PY
      - name: Commit single cleaned homepage
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Remove obsolete RM checklist loader and duplicate inline styles"
            git pull --rebase origin main
            git push origin main
          fi

name: Clean RM homepage assets
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/install-compact-dashboard.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Remove legacy duplicate script and style references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path=Path('index.html')
          page=path.read_text(encoding='utf-8')
          # Prevent flash-of-legacy-content before the live RM dashboard initializes.
          # The obsolete rm492 script used to recreate a duplicate Today template.
          page=re.sub(r'<script[^>]*id="rm492-consolidate"[^>]*>.*?</script>','',page,flags=re.S)
          guard_re=r'<style[^>]*id="rm-prepaint-legacy-guard"[^>]*>.*?</style>'
          page=re.sub(guard_re,'',page,flags=re.S)
          prepaint='''<style id="rm-prepaint-legacy-guard">
          /* Hide retired workboard cards before first paint; retain a failure fallback. */
          #view-week #rm350Workboard:not(.rmExecFallback) > .rm350-hero,
          #view-week #rm350Workboard:not(.rmExecFallback) > .rm350-shell,
          #view-week #rm350Workboard:not(.rmExecFallback) > .rm358-banner,
          #view-week #rm350Workboard:not(.rmExecFallback) > .rm358-source-drawer,
          #view-week #rm350Workboard #rm492Additional,
          #view-week #rm350Workboard #rm490Bottom,
          /* The original v113 and v134 mobile fallback explicitly force display!important.
             Extra ID specificity prevents those later rules reviving retired templates. */
          #view-week #weeklyCallPlanCard#weeklyCallPlanCard,
          #view-week #v113AmandaDashboard#v113AmandaDashboard,
          #view-week #v22AmandaSnapshotPlan#v22AmandaSnapshotPlan,
          #view-week #secondaryWorkQueues#secondaryWorkQueues,
          #view-week #v134LoadNotice#v134LoadNotice{display:none!important}
          #view-week #rm350Workboard:not(.rmExecReady):not(.rmExecFallback) #rm490Score{visibility:hidden!important}
          </style>'''
          if '</head>' not in page:
              raise SystemExit('Missing head close; cannot inject prepaint guard')
          page=page.replace('</head>',prepaint+'</head>',1)
          # Payroll language does not belong on Amanda's RM relationship dashboard.
          # This changes display labels only, not score calculations or financial records.
          page=page.replace('Portfolio scorecard diagnostic (not payroll-approved)','Portfolio scorecard diagnostic · pending Power BI verification')
          page=page.replace('Portfolio Outcome Estimate · Not Payroll-Certified','Portfolio Scorecard Estimate · Awaiting Data Verification')
          # Obsolete checklist is superseded by the authoritative daily worklists.
          page=re.sub(r'<script[^>]*outstanding-daily-checklist[.]js[^>]*></script>','',page)
          # Preserve one copy of each in-use external asset and apply current revision.
          assets={
            'compact-workspace.js':'20261110-clean19',
            'daily-execution-coaching.js':'20261110-coaching25',
            'fast-activity-workflow.js':'20261110-fast5',
            'relationship-funnel.js':'20261110-funnel5',
            'scorecard-source-summary.js':'20261110-source4',
          }
          for filename,revision in assets.items():
              page=re.sub(r'<script[^>]*'+re.escape(filename)+r'[^>]*></script>','',page)
              asset='<script defer src="./ui/'+filename+'?v='+revision+'"></script>'
              if '</body>' not in page:
                  raise SystemExit('Missing body close; not modifying homepage')
              page=page.replace('</body>',asset+'</body>',1)
          # Original installer added this identical rule repeatedly outside the body.
          style_re=r'<style[^>]*id="rm-uniform-prospecting-row"[^>]*>.*?</style>'
          blocks=re.findall(style_re,page,flags=re.S)
          page=re.sub(style_re,'',page,flags=re.S)
          if blocks:
              page=page.replace('</head>',blocks[-1]+'</head>',1)
          path.write_text(page,encoding='utf-8')
          print('Removed obsolete checklist and',max(0,len(blocks)-1),'duplicate style blocks')
          PY
      - name: Commit single cleaned homepage
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Remove obsolete RM checklist loader and duplicate inline styles"
            for attempt in 1 2 3 4; do
              git pull --rebase origin main
              if git push origin main; then break; fi
              if [ "$attempt" -eq 4 ]; then exit 1; fi
              sleep 2
            done
          fi

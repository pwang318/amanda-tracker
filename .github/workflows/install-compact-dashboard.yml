name: Install compact RM dashboard
on:
  push:
    paths:
      - 'ui/compact-workspace.js'
      - 'ui/relationship-funnel.js'
      - 'ui/scorecard-source-summary.js'
      - 'ui/fast-activity-workflow.js'
      - 'ui/outstanding-daily-checklist.js'
      - '.github/workflows/install-compact-dashboard.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Include compact layout asset in RM application
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          import re
          asset='<script defer src="./ui/compact-workspace.js?v=20261109-clean7"></script>'
          old=r'<script defer src="\./ui/compact-workspace\.js\?v=[^"]+"></script>'
          if re.search(old,s):
              s=re.sub(old,asset,s,count=1)
          else:
              if '</body>' not in s:
                  raise SystemExit('Missing closing body tag')
              s=s.replace('</body>',asset+'</body>',1)
          funnel='<script defer src="./ui/relationship-funnel.js?v=20261109-funnel2"></script>'
          old_funnel=r'<script defer src="\./ui/relationship-funnel\.js\?v=[^"]+"></script>'
          if re.search(old_funnel,s):
              s=re.sub(old_funnel,funnel,s,count=1)
          else:
              s=s.replace('</body>',funnel+'</body>',1)
          summary='<script defer src="./ui/scorecard-source-summary.js?v=20261109-source1"></script>'
          old_summary=r'<script defer src="\./ui/scorecard-source-summary\.js\?v=[^"]+"></script>'
          if re.search(old_summary,s):
              s=re.sub(old_summary,summary,s,count=1)
          else:
              s=s.replace('</body>',summary+'</body>',1)
          # Override the original gradient rule at its actual selector specificity.
          # Inline near the end of index.html so it wins even when JavaScript is cached.
          style='<style id="rm-uniform-prospecting-row">#rm350Workboard .rm-daily-steps li.rm-daily-prospect-step{background:#fff!important;background-image:none!important;border:0!important;border-bottom:1px solid #eee8f3!important;border-radius:0!important;box-shadow:none!important;padding:12px 0!important;margin:0!important}#rm350Workboard .rm-daily-steps li.rm-daily-prospect-step .rm-daily-step-num{background:#f1e8fa!important;color:#67468e!important}#rm350Workboard .rm-daily-steps li.rm-daily-prospect-step .rm-daily-step-copy b{color:inherit!important}</style>'
          s=re.sub(r'<style id="rm-uniform-prospecting-row">[\\s\\S]*?</style>', '', s)
          s=s.replace('</html>',style+'</html>',1)
          # Keep missed campaign touches visible even when the original four weeks end.
          s=s.replace('const cut=plusDays(day,-42);','const cut=plusDays(day,-365);',1)
          s=s.replace('if(age<0||age>35)return;','if(age<0)return;',1)
          # Reuse the authoritative morning worklist for live checklist counts.
          bridge='window.rmV462LoadMorningRows=loadMorningRows;'
          # Repair the literal backslash-n inserted by the prior workflow version.
          s=s.replace(bridge+chr(92)+'nasync function ensureXlsx(){',bridge+chr(10)+'async function ensureXlsx(){')
          marker='async function ensureXlsx(){'
          if bridge not in s:
              if marker not in s:
                  raise SystemExit('Morning worklist implementation not found; refusing incomplete checklist deployment')
              s=s.replace(marker,bridge+chr(10)+marker,1)
          for filename,version in [('fast-activity-workflow.js','20261109-fast2'),('outstanding-daily-checklist.js','20261109-check3')]:
              asset='<script defer src="./ui/'+filename+'?v='+version+'"></script>'
              old=r'<script defer src="\\./ui/'+re.escape(filename)+r'\\?v=[^"]+"></script>'
              if re.search(old,s):
                  s=re.sub(old,lambda _:asset,s,count=1)
              else:
                  s=s.replace('</body>',asset+'</body>',1)
          # A previous installation left duplicate defer tags. Normalize the tracked
          # assets to exactly one tag each, including the daily execution plan.
          for filename,version in [
              ('compact-workspace.js','20261109-clean9'),
              ('daily-execution-coaching.js','20261109-coaching9'),
              ('outstanding-daily-checklist.js','20261109-check4'),
              ('fast-activity-workflow.js','20261109-fast2'),
              ('relationship-funnel.js','20261109-funnel2'),
              ('scorecard-source-summary.js','20261109-source1')
          ]:
              pattern='<script[^>]*'+re.escape(filename)+'[^>]*></script>'
              s=re.sub(pattern,'',s)
              s=s.replace('</body>','<script defer src="./ui/'+filename+'?v='+version+'"></script></body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit dashboard update
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Load compact RM workspace on homepage"
            git push
          fi

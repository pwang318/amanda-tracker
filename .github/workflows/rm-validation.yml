name: RM tracker regression
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify RM outstanding work and portfolio safeguards
        run: |
          node tests/rm-v495-regression.cjs
          node tests/rm-growth-workspace.test.cjs
          node tests/rm-growth-command.test.cjs
          node tests/rm-growth-deep-dive.test.cjs
          node tests/rm-daily-relationship-audit.test.cjs
          node tests/rm-scorecard-integrity.test.cjs
          node tests/rm-new-workflow.test.cjs
          node tests/rm-daily-tile-routing.test.cjs
          node tests/rm-activity-tile-behavior.test.cjs
          node tests/rm-runtime-cleanup.test.cjs
